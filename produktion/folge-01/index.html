<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/MotionPathPlugin.min.js"></script>
    <script>
      gsap.registerPlugin(MotionPathPlugin);
    </script>
    <style>
      :root {
        --sea: #0f3a4b;
        --sea-deep: #0a2733;
        --land: #e9dcc0;
        --hl: #f3b33d;
        --route: #ff5a3a;
        --ink: #ffffff;
        --yellow: #ffd23f;
        --night: #0b1c25;
        --font: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font);
      }
      #root > div {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
